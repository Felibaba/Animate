html,body{height:100%;margin:0;background:var(--page);font-family:Georgia,"Times New Roman",serif}

.fb{transform-box:fill-box}

.wave{transform-origin:335px 345px;animation:wv 2.4s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-4deg)}to{transform:rotate(7deg)}}
.cp{font:italic 400 28px Georgia,serif;fill:#111;text-anchor:middle}.rec{animation:rc 1.2s steps(1) infinite}.wave2{transform-origin:165px 335px;animation:wv2 2.8s ease-in-out infinite alternate}@keyframes wv2{from{transform:rotate(4deg)}to{transform:rotate(-7deg)}}
@keyframes rc{50%{opacity:.15}}
@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-iteration-count:1!important}}
:root{--card:#fff;--bd:#ecd9ae;--ac:#8f35bd;--acx:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--card:#2a2040;--bd:#43385e;--ac:#c9a0ff;--acx:#1c1530}}
:root[data-theme="dark"]{--card:#2a2040;--bd:#43385e;--ac:#c9a0ff;--acx:#1c1530}
[hidden]{display:none!important}
.pn{width:min(94vw,420px);box-sizing:border-box;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;color:var(--ink);font:14px/1.4 system-ui,sans-serif}
.pn textarea,.pn input[type=text],.pn input[type=password],.pn select{width:100%;box-sizing:border-box;font:inherit;color:inherit;background:var(--page);border:1px solid var(--bd);border-radius:10px;padding:9px 10px;margin:6px 0}
.pn textarea{height:120px;resize:vertical;font-size:16px}
.r{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.r select{width:auto!important;flex:1;margin:0!important}
.pn button{font:inherit;color:inherit;background:var(--page);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;min-height:44px}
.pn button.a,.dl{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.pn button:disabled{opacity:.5}
.dl{padding:10px 14px;border-radius:10px;text-decoration:none;min-height:44px;box-sizing:border-box;display:inline-flex;align-items:center}
.bar{height:8px;background:var(--page);border-radius:6px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac);transition:width .2s}
#sp[data-k=err] b{color:#e03131}#sp[data-k=ok] b{color:#2f9e44}.ind{animation:ind 1s infinite alternate}@keyframes ind{from{opacity:.35}to{opacity:1}}
.pn small{color:var(--muted)}
</style>
</head>
